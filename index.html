<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Planner | Digitalna tabla</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-header">
  <div>
    <p class="eyebrow">WEB PROGRAMIRANJE</p>
    <h1>Campus Planner</h1>
    <p class="subtitle">Jednostavna digitalna tabla za planiranje studentskih obaveza.</p>
  </div>
  <div class="status" id="itemCount">0 stavki</div>
</header>

<nav class="toolbar" aria-label="Alati">
  <button id="addNoteBtn">+ Bilješka</button>
  <button id="addImageBtn">+ Slika</button>
  <button id="addQuoteBtn">+ Motivacija</button>
  <button id="saveBtn">Sačuvaj</button>
  <button id="clearBtn" class="danger">Očisti tablu</button>
</nav>

<main id="board" aria-label="Digitalna tabla">
  <div class="pinned-img img1"><img src="assets/task-planning.png" alt="Planiranje zadataka"></div>
  <div class="pinned-img img2"><img src="assets/focus-session.png" alt="Sesija fokusa"></div>
  <div class="pinned-img img3"><img src="assets/project-ideas.png" alt="Projektne ideje"></div>
  <div class="pinned-img img4"><img src="assets/final-check.png" alt="Završna provjera"></div>
</main>

<footer>Studentski projekat • Web programiranje • Tuzla • 2026</footer>
<script src="javascript.js"></script>
</body>
</html>
